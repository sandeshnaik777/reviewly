version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewly-app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - APP_URL=${APP_URL:-http://localhost:4000}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:4000}
      - JWT_SECRET=${JWT_SECRET:-super_secret_production_jwt_key_987654321}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_Tl2MArOfBOPxJJ}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-xBpdUXMs0YQbRQ8Wrb0EpzcH}
      - DATABASE_FILE=/app/data/review_platform.json
    volumes:
      - reviewly_data:/app/data

  # Optional Production Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: reviewly-postgres
    restart: always
    environment:
      POSTGRES_DB: reviewly_production
      POSTGRES_USER: reviewly_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureProductionDbPassword2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql

volumes:
  reviewly_data:
  postgres_data:
