server {
    listen 80;
    server_name www.kindlyrate.com;
    return 301 https://kindlyrate.com$request_uri;
}

server {
    listen 80 default_server;
    server_name kindlyrate.com _;

    client_max_body_size 10M;

    # Disable absolute redirects to prevent http redirect loops behind Cloudflare
    absolute_redirect off;

    # Gzip compression for faster mobile and web loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /var/www/kindlyreview/frontend/dist;
    index index.html;

    # Backend API & Dynamic Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Short Links and QR redirects if needed
    location /r/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Frontend Fallback with static pre-render match (no redirect needed)
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}

