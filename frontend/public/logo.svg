  <!-- Icon: rounded lowercase k -->
  <path d="M280 65
           Q280 58 288 58
           H321
           Q395 58 395 133
           V313
           Q395 388 321 388
           H288 Q280 388 280 380 Z"
        fill="#00383B"/>

