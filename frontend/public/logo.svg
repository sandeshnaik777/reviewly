  <!-- Wordmark -->
  <text x="400" y="482"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif"
        font-size="82"
        font-weight="700"
        letter-spacing="-3">
    <tspan fill="#00383B">kindly</tspan><tspan fill="url(#wordGreen)">review</tspan>
  </text>
