  <!-- Inner crossing ribbon -->
  <path d="M281 387
           C310 320 359 267 409 238
           C445 218 480 220 510 244
           C473 229 440 240 409 265
           C368 297 348 342 342 367
           C332 387 310 395 281 387 Z"
