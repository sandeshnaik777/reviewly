<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39C98A"/>
      <stop offset="100%" stop-color="#009B83"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#71E5A0"/>
      <stop offset="100%" stop-color="#00A88B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54A"/>
      <stop offset="100%" stop-color="#FFA51F"/>
    </linearGradient>
    <linearGradient id="wordGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#008F79"/>
      <stop offset="100%" stop-color="#16B88B"/>
